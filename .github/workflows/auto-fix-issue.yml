name: Auto Fix Issue by AI Agent

on:
  issues:
    types: [labeled]

jobs:
  auto-fix:
    # 只有当打上的标签是 'auto-fix' 时才触发 Agent 修复流程
    if: github.event.label.name == 'auto-fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整拉取历史，方便 git 操作

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node Dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity

      - name: Run Antigravity AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_ID: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/agents/issue_resolver.py

      # 推送分支并使用 GitHub CLI (gh) 自动创建 Pull Request
      - name: Push Branch and Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="fix/issue-${{ github.event.issue.number }}"
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME found. Pushing to origin..."
            git push origin "$BRANCH_NAME" --force
            gh pr create \
              --title "fix: automatically resolved issue #${{ github.event.issue.number }}" \
              --body "This PR was generated automatically by the Antigravity Issue Resolver Agent. Closes #${{ github.event.issue.number }}" \
              --head "$BRANCH_NAME" \
              --base "${{ github.event.repository.default_branch }}" || echo "PR already exists."
          else
            echo "No fix branch was created by the Agent."
          fi
