name: Auto Triage Issue & Weekday Noon PR/Issue Patrol

on:
  # 1. 工作日每天中午 12:30 (北京时间 UTC+8 -> UTC 04:30) 定时执行
  schedule:
    - cron: '30 4 * * 1-5'
  # 2. 当有新 Issue 提交时自动预检版本与包名信息
  issues:
    types: [opened]
  # 3. 支持在 GitHub Actions 面板手动一键触发
  workflow_dispatch:
    inputs:
      auto_triage:
        description: '是否对缺失包名/版本号的 0 回复 Issue 自动发送引导评论'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  patrol-and-triage:
    name: "AI 巡检 / 可合并 PR 汇总与 Issue 分诊预检"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 执行 GitHub PR 可合并巡检与 Issue 版本/包名自动分诊
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          NUTUI_WEBHOOK_URL: ${{ secrets.NUTUI_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "🔍 检测到新创建的 Issue #${{ github.event.issue.number }}，正在执行组件源码定位与版本/包名核验..."
            node scripts/agents/github-copilot-hub.mjs issue "${{ github.event.issue.number }}"
            node scripts/agents/github-copilot-hub.mjs issues --auto-triage
          else
            echo "🚀 正在执行工作日午间 PR 可合并状态巡检与 Issue 自动分诊..."
            if [ "${{ inputs.auto_triage }}" = "false" ]; then
              node scripts/agents/github-copilot-hub.mjs status
            else
              node scripts/agents/github-copilot-hub.mjs status --auto-triage
            fi
          fi
