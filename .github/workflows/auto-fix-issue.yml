name: Auto Fix Issue by AI Agent

on:
  issues:
    types: [labeled]
  # 允许在 GitHub Actions UI 界面中手动输入参数并运行该工作流，方便测试任何分支
  workflow_dispatch:
    inputs:
      issue_id:
        description: '需要修复的 Issue 编号 (例如: 3396)'
        required: true
        default: '3396'
      issue_title:
        description: 'Issue 标题'
        required: false
        default: 'DatePicker time range bug'
      issue_body:
        description: 'Issue 详情描述说明'
        required: false
        default: 'DatePicker fails to calculate minutes range under time mode.'

jobs:
  auto-fix:
    # 只有当打上的标签是 'auto-fix'，或者通过手动触发 (workflow_dispatch) 时，才执行任务
    if: github.event.label.name == 'auto-fix' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 完整拉取历史，方便 git 操作

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node Dependencies
        run: pnpm install

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-antigravity

      - name: Run Antigravity AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 兼容处理：支持来自 GitHub Issue 事件的数据或手动输入的参数
          ISSUE_ID: ${{ github.event.issue.number || inputs.issue_id }}
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.issue_title }}
          ISSUE_BODY: ${{ github.event.issue.body || inputs.issue_body }}
        run: python scripts/agents/issue_resolver.py

      # 推送分支并使用 GitHub CLI (gh) 自动创建 Pull Request
      - name: Push Branch and Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取实际的 Issue ID
          ACTUAL_ISSUE_ID="${{ github.event.issue.number || inputs.issue_id }}"
          BRANCH_NAME="fix/issue-$ACTUAL_ISSUE_ID"
          
          if git show-ref --verify --quiet "refs/heads/$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME found. Pushing to origin..."
            git push origin "$BRANCH_NAME" --force
            gh pr create \
              --title "fix: automatically resolved issue #$ACTUAL_ISSUE_ID" \
              --body "This PR was generated automatically by the Antigravity Issue Resolver Agent. Closes #$ACTUAL_ISSUE_ID" \
              --head "$BRANCH_NAME" \
              --base "${{ github.event.repository.default_branch }}" || echo "PR already exists."
          else
            echo "No fix branch was created by the Agent."
          fi
