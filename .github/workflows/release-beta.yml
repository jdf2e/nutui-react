name: Release Beta

on:
#  pull_request:
  push:
    branches:
      - feat_v3.x
      - feat_v4.x
  workflow_dispatch:

jobs:
  release-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
#          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get commit message
        run: |
          COMMIT_MESSAGE=$(git log --format=%s -n 1)
          FILTERED_MESSAGE="${COMMIT_MESSAGE//[^a-zA-Z0-9.()_:, -]/}"
          echo "COMMIT_MESSAGE=${FILTERED_MESSAGE}" >> $GITHUB_ENV
      - name: Show commit message
        run: echo "$COMMIT_MESSAGE"

      - name: Commit message compliance verification
        if: |
          !startsWith( env.COMMIT_MESSAGE , 'chore(release):' ) ||
          !contains( env.COMMIT_MESSAGE , '-beta' )
        run: echo "ABORT=true" >> $GITHUB_ENV

      - name: Get Tag message
        if: contains( env.COMMIT_MESSAGE , '-beta')
        run: echo "RELEASE_TAG=beta" >> $GITHUB_ENV
#
      - name: Install pnpm
        run: npm i -g pnpm@10

      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26
          node-version: '22'
          cache: 'pnpm'

      # Trusted Publishing needs a recent npm CLI (OIDC exchange)
      - name: Upgrade npm for Trusted Publishing
        if: env.ABORT != 'true'
        run: npm i -g npm@12

      - name: Install dependencies
        if: env.ABORT != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Build
        if: env.ABORT != 'true'
        run: |
          if ! pnpm build; then
            echo "构建 nutui-react 失败"
            exit 1
          fi
          if ! pnpm build:taro; then
            echo "构建 nutui-react-taro 失败"
            exit 1
          fi

      # No NPM_TOKEN: auth via GitHub OIDC + npm Trusted Publisher
      - name: Run Release @nutui/nutui-react
        if: env.ABORT != 'true'
        working-directory: ./release/h5
        run: npm publish --tag beta --access public --provenance

      - name: Run Releases @nutui/nutui-react-taro
        if: env.ABORT != 'true'
        working-directory: ./release/taro
        run: npm publish --tag beta --access public --provenance
