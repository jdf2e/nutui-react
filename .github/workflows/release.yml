name: Release

on:
  push:
    tags:
      - 'v3.*'
      - 'v4.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip pre-release tags (e.g. v4.0.0-beta.11) created by Release Beta
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm i -g pnpm@10

      # Do NOT set registry-url: empty NODE_AUTH_TOKEN would bypass OIDC and cause E404.
      - uses: actions/setup-node@v7
        with:
          # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26
          node-version: '22'
          cache: 'pnpm'

      - name: Upgrade npm for Trusted Publishing
        run: npm i -g npm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: |
          if ! pnpm build; then
            echo "构建 nutui-react 失败"
            exit 1
          fi
          if ! pnpm build:taro; then
            echo "构建 nutui-react-taro 失败"
            exit 1
          fi

      # Auth via GitHub OIDC + npm Trusted Publisher (no NPM_TOKEN)
      - name: Publish @nutui/nutui-react
        working-directory: ./release/h5
        run: npm publish --access public --provenance

      - name: Publish @nutui/nutui-react-taro
        working-directory: ./release/taro
        run: npm publish --access public --provenance
