name: Release

on:
  push:
    tags:
      - v3.*
      - v4.*
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm i -g pnpm@10

      - uses: actions/setup-node@v7
        with:
          registry-url: 'https://registry.npmjs.org'
          # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26
          node-version: '22'
          cache: 'pnpm'

      # Trusted Publishing needs a recent npm CLI (OIDC exchange)
      - name: Upgrade npm for Trusted Publishing
        run: npm i -g npm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        if: env.ABORT != 'true'
        run: |
          if ! pnpm build; then
            echo "构建 nutui-react 失败"
            exit 1
          fi
          if ! pnpm build:taro; then
            echo "构建 nutui-react-taro 失败"
            exit 1
          fi

      # No NPM_TOKEN: auth via GitHub OIDC + npm Trusted Publisher
      - name: Run Release @nutui/nutui-react
        if: env.ABORT != 'true'
        working-directory: ./release/h5
        run: npm publish --access public --provenance

      - name: Run Releases @nutui/nutui-react-taro
        if: env.ABORT != 'true'
        working-directory: ./release/taro
        run: npm publish --access public --provenance
