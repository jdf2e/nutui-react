name: Release

on:
  push:
    tags:
      - 'v3.*'
      - 'v4.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm Trusted Publishing (OIDC)
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve npm dist-tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${VERSION}" == *beta* ]]; then
            echo "DIST_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "DIST_TAG=latest" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Publish ${VERSION} with dist-tag: $([[ "${VERSION}" == *beta* ]] && echo beta || echo latest)"

      - name: Install pnpm
        run: npm i -g pnpm@10

      # Do NOT set registry-url: empty NODE_AUTH_TOKEN would bypass OIDC and cause E404.
      - uses: actions/setup-node@v7
        with:
          # npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26
          node-version: '22'
          cache: 'pnpm'

      - name: Upgrade npm for Trusted Publishing
        run: npm i -g npm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: |
          if ! pnpm build; then
            echo "构建 nutui-react 失败"
            exit 1
          fi
          if ! pnpm build:taro; then
            echo "构建 nutui-react-taro 失败"
            exit 1
          fi

      # Auth via GitHub OIDC + npm Trusted Publisher (no NPM_TOKEN)
      # Skip if version already exists (e.g. H5 published but Taro failed mid-run)
      - name: Publish @nutui/nutui-react
        working-directory: ./release/h5
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PKG}@${VER} already on npm, skip"
          else
            npm publish --access public --tag "${DIST_TAG}" --provenance
          fi

      - name: Publish @nutui/nutui-react-taro
        working-directory: ./release/taro
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "${PKG}@${VER}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${PKG}@${VER} already on npm, skip"
          else
            npm publish --access public --tag "${DIST_TAG}" --provenance
          fi
