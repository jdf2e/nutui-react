name: AI PR Automated Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat_v4.x
      - next
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  ai-review:
    name: NutUI AI Quality Gate & Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Run AI PR Review & Quality Gates
        id: review
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/agents/nutui-ci-review.mjs "origin/${{ github.base_ref }}"

      - name: Report Checks and Comment to PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const sha = pr?.head?.sha;
            const issue_number = pr?.number;

            // 1. 在图 1 红框 Checks 列表中挂载原子 List 状态项（通过显示 ✅，卡住显示 ❌ 与明确原因）
            const statusPath = path.join(process.env.GITHUB_WORKSPACE, 'pr-review-status.json');
            if (fs.existsSync(statusPath) && sha) {
              try {
                const statuses = JSON.parse(fs.readFileSync(statusPath, 'utf-8'));
                for (const item of statuses) {
                  await github.rest.repos.createCommitStatus({
                    owner,
                    repo,
                    sha,
                    state: item.state, // 'success' 或 'failure'
                    context: item.context,
                    description: item.description,
                  });
                }
              } catch (err) {
                console.error('挂载 Commit Status 失败:', err);
              }
            }

            // 2. 将非统计维度的深度评审报告发表 / 更新到 PR 讨论区
            const reportPath = path.join(process.env.GITHUB_WORKSPACE, 'pr-review-report.md');
            if (fs.existsSync(reportPath) && issue_number) {
              try {
                let body = fs.readFileSync(reportPath, 'utf-8');
                const author = pr.user?.login;
                if (author) {
                  body = `> 🔔 **@${author}** 您好，NutUI AI 质量门禁已完成对本次 PR 的自动化审查与质量核验：\n\n` + body;
                }

                const comments = await github.rest.issues.listComments({
                  owner,
                  repo,
                  issue_number,
                });
                const botComment = comments.data.find(comment => 
                  comment.body && comment.body.includes('NutUI-React AI 自动化 PR')
                );

                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: botComment.id,
                    body,
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body,
                  });
                }
              } catch (err) {
                console.error('更新 PR 评论失败:', err);
              }
            }
